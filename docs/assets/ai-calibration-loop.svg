  <text x="1032" y="265" fill="#9fe9df" font-size="15" font-family="Segoe UI, sans-serif">执行</text>
  <text x="645" y="555" fill="#9fe9df" font-size="17" font-family="Segoe UI, sans-serif">结果、证据、审计与回滚状态</text>
