    <text x="225" y="522" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="14">测量 · 标定 · 诊断 · 刷写 · 网络</text>
    <text x="225" y="552" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">CANape / ECU / Vector Hardware</text>

