    <text x="225" y="331" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI,Arial,sans-serif" font-size="14">重试 · 超时 · 检查点 · Dry-run</text>
    <text x="225" y="357" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">跨车辆 / 软件 / 标定批量回归</text>

