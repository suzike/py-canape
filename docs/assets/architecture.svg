  </g>

  <path d="M600 212V246" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M225 388V435" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 388V435" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M975 388V435" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

