  </defs>
  <rect width="1200" height="660" rx="26" fill="url(#bg)"/>
  <circle cx="1070" cy="85" r="170" fill="#0ea5e9" opacity=".07"/>
  <circle cx="120" cy="600" r="210" fill="#14b8a6" opacity=".06"/>

