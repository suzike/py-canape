    <text x="600" y="492" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Offline Data Layer</text>
    <text x="600" y="522" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI,Arial,sans-serif" font-size="14">MDF · BLF · A2L · DBC · Tables</text>
