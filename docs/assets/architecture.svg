    <text x="975" y="492" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Analysis Core</text>
    <text x="975" y="522" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI,Arial,sans-serif" font-size="14">质量 · 因果 · 状态 · 时序 · A/B</text>
