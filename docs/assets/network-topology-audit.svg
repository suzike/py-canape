<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Agent2Canape 网络拓扑与数据库一致性审计</title><desc id="desc">受控拓扑清单与CANape实时网络设备及DBC A2L资产对比形成门禁报告</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#20254e"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#67e8f9"/></marker></defs><rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <text x="55" y="60" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">网络拓扑与数据库一致性门禁</text><text x="55" y="92" fill="#a7c7e6" font-family="Segoe UI,Arial" font-size="17">清单语义与 COM 实时事实分离 · 标定与测量前先确认工程身份</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(55 145)"><rect width="230" height="165" rx="18" fill="#103744" stroke="#2dd4bf" stroke-width="2"/><text x="115" y="42" fill="#ccfbf1" font-size="21" font-weight="700">受控拓扑清单</text><text x="115" y="78" fill="#99f6e4" font-size="16">总线类型 / 波特率</text><text x="115" y="108" fill="#99f6e4" font-size="16">ECU / 通道 / 驱动</text><text x="115" y="138" fill="#99f6e4" font-size="16">SHA-256 基线</text></g><g transform="translate(345 145)"><rect width="230" height="165" rx="18" fill="#322a55" stroke="#a78bfa" stroke-width="2"/><text x="115" y="42" fill="#ede9fe" font-size="21" font-weight="700">CANape 实时快照</text><text x="115" y="78" fill="#ddd6fe" font-size="16">网络名称 / 激活态</text><text x="115" y="108" fill="#ddd6fe" font-size="16">设备 / 在线态 / 通道</text><text x="115" y="138" fill="#ddd6fe" font-size="16">数据库绑定</text></g><g transform="translate(635 145)"><rect width="230" height="165" rx="18" fill="#3b2d16" stroke="#f59e0b" stroke-width="2"/><text x="115" y="42" fill="#fef3c7" font-size="21" font-weight="700">数据库语义</text><text x="115" y="78" fill="#fde68a" font-size="16">DBC 节点 / 报文 / ID</text><text x="115" y="108" fill="#fde68a" font-size="16">信号与 A2L 对象</text><text x="115" y="138" fill="#fde68a" font-size="16">引用完整性</text></g><g transform="translate(925 145)"><rect width="220" height="165" rx="18" fill="#123b31" stroke="#34d399" stroke-width="2"/><text x="110" y="42" fill="#d1fae5" font-size="21" font-weight="700">差异门禁</text><text x="110" y="78" fill="#a7f3d0" font-size="16">缺失 / 错绑 / 漂移</text><text x="110" y="108" fill="#a7f3d0" font-size="16">稳定快照摘要</text><text x="110" y="138" fill="#a7f3d0" font-size="16">阻断危险操作</text></g></g>
  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M285 227h52"/><path d="M575 227h52"/><path d="M865 227h52"/></g><path d="M1035 325c0 55-870 55-870 0" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="600" y="400" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial" font-size="16">审计证据回到 CNA、数据库和车辆软件版本基线</text>
</svg>
