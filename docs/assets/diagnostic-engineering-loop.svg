<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent2Canape UDS 诊断工程闭环</title>
  <desc id="desc">诊断清单经过状态门禁、CANape执行和响应证据解析形成闭环</desc>
  <rect width="1200" height="420" rx="28" fill="#071827"/>
  <text x="56" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">UDS 诊断工程闭环</text>
  <text x="56" y="90" fill="#9cc7e8" font-family="Segoe UI,Arial" font-size="17">清单先行 · 状态受控 · 请求需审批 · 原始响应可追溯</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <g transform="translate(55 140)"><rect width="230" height="170" rx="18" fill="#103744" stroke="#2dd4bf" stroke-width="2"/><text x="115" y="42" fill="#ccfbf1" font-size="21" font-weight="700">诊断清单</text><text x="115" y="79" fill="#99f6e4" font-size="16">服务 / 原始请求</text><text x="115" y="110" fill="#99f6e4" font-size="16">P2 / P2* / NRC</text><text x="115" y="141" fill="#99f6e4" font-size="16">ECU 与步骤身份</text></g>
    <g transform="translate(345 140)"><rect width="230" height="170" rx="18" fill="#302857" stroke="#a78bfa" stroke-width="2"/><text x="115" y="42" fill="#ede9fe" font-size="21" font-weight="700">状态门禁</text><text x="115" y="79" fill="#ddd6fe" font-size="16">会话 / 安全等级</text><text x="115" y="110" fill="#ddd6fe" font-size="16">Tester Present</text><text x="115" y="141" fill="#ddd6fe" font-size="16">外部 Action Plan 审批</text></g>
    <g transform="translate(635 140)"><rect width="230" height="170" rx="18" fill="#3b2d16" stroke="#f59e0b" stroke-width="2"/><text x="115" y="42" fill="#fef3c7" font-size="21" font-weight="700">CANape 执行</text><text x="115" y="79" fill="#fde68a" font-size="16">命名 / Raw UDS</text><text x="115" y="110" fill="#fde68a" font-size="16">COM Pending 等待</text><text x="115" y="141" fill="#fde68a" font-size="16">失败立即安全清理</text></g>
    <g transform="translate(925 140)"><rect width="220" height="170" rx="18" fill="#123b31" stroke="#34d399" stroke-width="2"/><text x="110" y="42" fill="#d1fae5" font-size="21" font-weight="700">诊断证据</text><text x="110" y="79" fill="#a7f3d0" font-size="16">正响应 / NRC 分类</text><text x="110" y="110" fill="#a7f3d0" font-size="16">DTC 快照差异</text><text x="110" y="141" fill="#a7f3d0" font-size="16">状态与 SHA-256 摘要</text></g>
  </g>
  <path d="M285 225h45m245 0h45m245 0h45" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M324 217l10 8-10 8m290-16l10 8-10 8m290-16l10 8-10 8" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="365" text-anchor="middle" fill="#bae6fd" font-family="Segoe UI,Arial" font-size="16">ResponsePending 只进入 P2* 证据，不自动重发非幂等请求 · 核心包不保存 Seed/Key</text>
</svg>
