<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent2Canape 标定目标持久化与恢复闭环</title>
  <desc id="desc">从审批后的 Working 数据集，经 RAM 写入回读、全设备屏障、ROM 持久化回读到证据日志；掉线进入重连与状态协调，失败进入逆序补偿。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152b"/>
      <stop offset="1" stop-color="#102b46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .title{font:700 27px "Segoe UI","Microsoft YaHei",sans-serif;fill:#f8fafc}
      .sub{font:400 15px "Segoe UI","Microsoft YaHei",sans-serif;fill:#a5c4dc}
      .box{fill:#102f4e;stroke:#38bdf8;stroke-width:2;rx:18;filter:url(#shadow)}
      .box2{fill:#183951;stroke:#34d399;stroke-width:2;rx:18;filter:url(#shadow)}
      .warn{fill:#412b38;stroke:#fb7185;stroke-width:2;rx:18;filter:url(#shadow)}
      .label{font:700 18px "Segoe UI","Microsoft YaHei",sans-serif;fill:#f8fafc;text-anchor:middle}
      .small{font:400 13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#c7d9e8;text-anchor:middle}
      .arrow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#fb7185;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="52" y="56" class="title">标定目标持久化与掉线恢复闭环</text>
  <text x="52" y="84" class="sub">明确区分 Working、RAM、ROM；每次硬件动作都必须回读、记录并可补偿</text>

  <rect x="52" y="130" width="190" height="112" class="box"/>
  <text x="147" y="173" class="label">审批后的 Working</text>
  <text x="147" y="202" class="small">数据集校验 · 职责分离</text>
  <text x="147" y="222" class="small">作业 ID · 内容摘要</text>

  <rect x="292" y="130" width="190" height="112" class="box"/>
  <text x="387" y="173" class="label">RAM 写入与回读</text>
  <text x="387" y="202" class="small">写前基线 · 参数验证</text>
  <text x="387" y="222" class="small">目标内容摘要比对</text>

  <rect x="532" y="130" width="190" height="112" class="box2"/>
  <text x="627" y="173" class="label">多 ECU RAM 屏障</text>
  <text x="627" y="202" class="small">全部 RAM 验证后</text>
  <text x="627" y="222" class="small">才允许进入 ROM 阶段</text>

  <rect x="772" y="130" width="190" height="112" class="box"/>
  <text x="867" y="173" class="label">ROM 持久化回读</text>
  <text x="867" y="202" class="small">项目回调 · 脚本或 ECU Job</text>
  <text x="867" y="222" class="small">不虚构通用烧写动作</text>

  <rect x="1012" y="130" width="140" height="112" class="box2"/>
  <text x="1082" y="173" class="label">证据闭环</text>
  <text x="1082" y="202" class="small">状态台账</text>
  <text x="1082" y="222" class="small">原子日志</text>

  <path d="M242 186 H282" class="arrow"/>
  <path d="M482 186 H522" class="arrow"/>
  <path d="M722 186 H762" class="arrow"/>
  <path d="M962 186 H1002" class="arrow"/>

  <rect x="292" y="330" width="260" height="118" class="warn"/>
  <text x="422" y="370" class="label">写后掉线：状态不确定</text>
  <text x="422" y="399" class="small">先重连并回读，不盲目重复写入</text>
  <text x="422" y="421" class="small">目标已生效则协调完成，否则失败</text>

  <rect x="650" y="330" width="260" height="118" class="warn"/>
  <text x="780" y="370" class="label">任一阶段失败</text>
  <text x="780" y="399" class="small">ROM → RAM 逆序补偿并回读</text>
  <text x="780" y="421" class="small">补偿不完整则要求人工恢复</text>

  <path d="M387 242 V320" class="dash"/>
  <path d="M867 242 C867 278 780 278 780 320" class="dash"/>
  <path d="M552 389 H640" class="dash"/>
  <path d="M780 448 C780 488 387 488 387 252" class="dash"/>
</svg>
