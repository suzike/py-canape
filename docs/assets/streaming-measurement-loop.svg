<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Agent2Canape 在线流式测量治理</title>
  <desc id="desc">CANape任务采样经过单线程订阅、有界缓冲、滚动质量统计和可恢复证据分卷</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#182451"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="410" rx="26" fill="url(#bg)"/><text x="55" y="60" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">在线流式测量：有界、可观测、可恢复</text><text x="55" y="92" fill="#a8c9e8" font-family="Segoe UI,Arial" font-size="17">同一 COM 调用线程 · 双重内存上限 · 明确背压 · 证据不静默覆盖</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(55 140)"><rect width="210" height="150" rx="18" fill="#103744" stroke="#2dd4bf" stroke-width="2"/><text x="105" y="42" fill="#ccfbf1" font-size="21" font-weight="700">CANape 任务采样</text><text x="105" y="78" fill="#99f6e4" font-size="16">Current / NextSample</text><text x="105" y="108" fill="#99f6e4" font-size="16">通道顺序校验</text></g><g transform="translate(315 140)"><rect width="210" height="150" rx="18" fill="#322a55" stroke="#a78bfa" stroke-width="2"/><text x="105" y="42" fill="#ede9fe" font-size="21" font-weight="700">调用线程订阅</text><text x="105" y="78" fill="#ddd6fe" font-size="16">重复 / 乱序丢弃</text><text x="105" y="108" fill="#ddd6fe" font-size="16">连续错误熔断</text></g><g transform="translate(575 140)"><rect width="210" height="150" rx="18" fill="#3b2d16" stroke="#f59e0b" stroke-width="2"/><text x="105" y="42" fill="#fef3c7" font-size="21" font-weight="700">有界时间窗</text><text x="105" y="78" fill="#fde68a" font-size="16">样本数 + 时间跨度</text><text x="105" y="108" fill="#fde68a" font-size="16">抖动 / 缺口 / 冻结</text></g><g transform="translate(835 140)"><rect width="310" height="150" rx="18" fill="#123b31" stroke="#34d399" stroke-width="2"/><text x="155" y="42" fill="#d1fae5" font-size="21" font-weight="700">JSONL / CSV 证据</text><text x="155" y="78" fill="#a7f3d0" font-size="16">分卷 · fsync · 原子检查点</text><text x="155" y="108" fill="#a7f3d0" font-size="16">恢复校验 · SHA-256 · 不自动删除</text></g></g>
  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M265 215h43"/><path d="M525 215h43"/><path d="M785 215h43"/></g><path d="M990 305c0 65-780 65-780 0" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="600" y="380" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial" font-size="16">质量与证据反馈到测量清单、标定实验和问题排查</text>
</svg>
